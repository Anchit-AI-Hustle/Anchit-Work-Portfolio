<style>
/* Aage Kya concept prototype: a light, print-like theme. */
:root{
  --ak-bg:#f7f4ee; --ak-surface:#ffffff; --ak-muted-surface:#f1ede4;
  --ak-ink:#1c1917; --ak-ink-2:#44403c; --ak-ink-3:#6b645c; --ak-line:#e2dccf;
  --ak-brand:#0f5c4d; --ak-brand-2:#0b4a3e; --ak-brand-soft:#e3f1ec; --ak-brand-line:#bfdcd2;
  --ak-amber:#b45309; --ak-amber-soft:#fdf1dc; --ak-amber-line:#f3d7a6; --ak-amber-ink:#8a3f06; --ak-amber-ink-2:#7c3a06;
  --ak-red:#b42318; --ak-red-soft:#fdecea; --ak-red-line:#f5c2bd; --ak-red-ink:#7a1b13;
  --ak-blue:#1d4ed8; --ak-mine:#f0f9f5; --ak-notice-ink:#f1ede4;
  --ak-font:"Noto Sans Devanagari","Mukta","Nirmala UI","Mangal",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ak-bg);color:var(--ak-ink);font-family:var(--ak-font);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
.ak-notice{background:var(--ak-ink);color:var(--ak-notice-ink);font-size:0.82rem;line-height:1.45;padding:0.5rem 1rem;text-align:center}
.ak-notice b{color:#fff}
.ak-page{min-height:100vh;background:var(--ak-bg);color:var(--ak-ink)}
.ak-wrap{max-width:1120px;margin:0 auto;padding:1.25rem 1rem 3rem}
.ak-page a{color:var(--ak-brand)}
.ak-page a:focus-visible,.ak-page button:focus-visible,.ak-page input:focus-visible,.ak-page select:focus-visible,.ak-notice a:focus-visible{outline:3px solid var(--ak-blue);outline-offset:2px}
.ak-nav{display:flex;flex-wrap:wrap;gap:0.4rem 1rem;align-items:center;font-size:0.88rem;margin-bottom:0.75rem}
.ak-nav a{font-weight:600;text-decoration:none;color:var(--ak-brand-2);min-height:32px;display:inline-flex;align-items:center}
.ak-nav a:hover{text-decoration:underline}
.ak-topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0.75rem;margin-bottom:1rem}
.ak-tags{display:flex;flex-wrap:wrap;gap:0.4rem}
.ak-tag{display:inline-flex;align-items:center;gap:0.3rem;padding:0.2rem 0.6rem;border-radius:999px;font-size:0.78rem;font-weight:600;background:var(--ak-muted-surface);color:var(--ak-ink-2);border:1px solid var(--ak-line)}
.ak-tag-brand{background:var(--ak-brand-soft);color:var(--ak-brand-2);border-color:var(--ak-brand-line)}
.ak-tag-amber{background:var(--ak-amber-soft);color:var(--ak-amber-ink);border-color:var(--ak-amber-line)}
.ak-tag-red{background:var(--ak-red-soft);color:var(--ak-red);border-color:var(--ak-red-line)}
.ak-tag-white{background:#fff;color:var(--ak-brand-2)}
.ak-lang{display:inline-flex;border:1px solid var(--ak-line);border-radius:999px;background:var(--ak-surface);padding:3px}
.ak-lang button{border:0;background:transparent;color:var(--ak-ink-2);font:inherit;font-size:0.88rem;font-weight:600;padding:0.3rem 0.85rem;border-radius:999px;cursor:pointer;min-height:36px}
.ak-lang button[aria-pressed="true"]{background:var(--ak-brand);color:#fff}
.ak-hero h1{font-size:clamp(1.75rem,4.5vw,2.6rem);line-height:1.2;margin:0.25rem 0 0.5rem;letter-spacing:-0.01em}
.ak-hero .ak-lead{font-size:clamp(1rem,2.2vw,1.15rem);color:var(--ak-ink-2);max-width:62ch;margin:0 0 1rem}
.ak-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.75rem;margin:1rem 0 1.25rem}
.ak-kpi{background:var(--ak-surface);border:1px solid var(--ak-line);border-radius:14px;padding:0.85rem 1rem;min-width:0}
.ak-kpi-value{font-size:1.5rem;font-weight:800;color:var(--ak-brand-2);line-height:1.2}
.ak-kpi-label{font-size:0.88rem;color:var(--ak-ink-2)}
.ak-kpi-src{font-size:0.74rem;color:var(--ak-ink-3);margin-top:0.25rem}
.ak-tabs{display:flex;gap:0.4rem;overflow-x:auto;padding-bottom:0.25rem;margin-bottom:1rem;scrollbar-width:thin}
.ak-tab{flex:0 0 auto;border:1px solid var(--ak-line);background:var(--ak-surface);color:var(--ak-ink-2);font:inherit;font-weight:600;font-size:0.92rem;padding:0.5rem 0.95rem;border-radius:10px;cursor:pointer;min-height:44px}
.ak-tab[aria-selected="true"],.ak-tab[aria-pressed="true"]{background:var(--ak-ink);color:#fff;border-color:var(--ak-ink)}
.ak-card{background:var(--ak-surface);border:1px solid var(--ak-line);border-radius:16px;padding:1.1rem;min-width:0}
.ak-card + .ak-card{margin-top:0.85rem}
.ak-card h2{font-size:1.25rem;margin:0 0 0.5rem;line-height:1.3}
.ak-card h3{font-size:1.02rem;margin:0 0 0.35rem;line-height:1.35}
.ak-muted{color:var(--ak-ink-3);font-size:0.88rem}
.ak-split{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:1rem;align-items:start}
.ak-phone{background:var(--ak-surface);border:1px solid var(--ak-line);border-radius:24px;padding:1rem;box-shadow:0 10px 30px rgba(28,25,23,0.08);min-width:0}
.ak-phone-bar{display:flex;justify-content:space-between;align-items:center;gap:0.5rem;font-size:0.78rem;color:var(--ak-ink-3);margin-bottom:0.75rem}
.ak-steps{display:flex;gap:0.3rem;margin-bottom:0.9rem}
.ak-steps span{flex:1;height:5px;border-radius:99px;background:var(--ak-line)}
.ak-steps span.on{background:var(--ak-brand)}
.ak-result{border-radius:14px;background:linear-gradient(135deg,#0f5c4d,#134e4a);color:#fff;padding:1rem}
.ak-result h2{font-size:0.85rem;font-weight:400;opacity:0.9;margin:0}
.ak-result .ak-big{font-size:2rem;font-weight:800;line-height:1.1}
.ak-step-h{font-size:1.15rem;margin:0 0 0.25rem;outline:none;line-height:1.35}
.ak-field{margin:0 0 0.9rem;border:0;padding:0;min-width:0}
.ak-field > legend,.ak-field > label{display:block;font-weight:700;font-size:0.95rem;margin-bottom:0.4rem;padding:0}
.ak-chips{display:flex;flex-wrap:wrap;gap:0.4rem}
.ak-chip{position:relative}
.ak-chip input{position:absolute;opacity:0;width:1px;height:1px}
.ak-chip span{display:inline-flex;align-items:center;min-height:40px;padding:0.35rem 0.8rem;border:1px solid var(--ak-line);border-radius:10px;background:var(--ak-surface);font-size:0.9rem;cursor:pointer}
.ak-chip input:checked + span{border-color:var(--ak-brand);background:var(--ak-brand-soft);color:var(--ak-brand-2);font-weight:700}
.ak-chip input:focus-visible + span{outline:3px solid var(--ak-blue);outline-offset:2px}
.ak-input,.ak-select{width:100%;min-width:0;min-height:44px;font:inherit;font-size:0.95rem;padding:0.5rem 0.7rem;border:1px solid var(--ak-line);border-radius:10px;background:var(--ak-surface);color:var(--ak-ink)}
.ak-range{width:100%;accent-color:var(--ak-brand)}
.ak-btn{display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;min-height:46px;padding:0.55rem 1.1rem;border-radius:12px;border:1px solid var(--ak-brand);background:var(--ak-brand);color:#fff;font:inherit;font-weight:700;font-size:0.98rem;line-height:1.35;cursor:pointer;text-decoration:none;text-align:center}
.ak-page a.ak-btn{color:#fff}
.ak-btn:hover{background:var(--ak-brand-2)}
.ak-btn:disabled{opacity:0.5;cursor:not-allowed}
.ak-btn-ghost{background:var(--ak-surface);color:var(--ak-brand-2)}
.ak-btn-ghost:hover{background:var(--ak-brand-soft)}
.ak-btn-block{width:100%}
.ak-grow{flex:1}
.ak-row{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center}
.ak-row.nowrap{flex-wrap:nowrap}
.ak-list{list-style:none;margin:0;padding:0;display:grid;gap:0.6rem}
.ak-item{border:1px solid var(--ak-line);border-radius:12px;padding:0.75rem 0.85rem;background:var(--ak-surface);min-width:0}
.ak-item-head{display:flex;justify-content:space-between;gap:0.5rem;align-items:flex-start;flex-wrap:wrap}
.ak-item p{margin:0.25rem 0 0;font-size:0.9rem;color:var(--ak-ink-2)}
.ak-item ul{margin:0.35rem 0 0;padding-left:1.1rem;font-size:0.9rem}
.ak-section-title{font-size:0.8rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ak-ink-3);margin:1.1rem 0 0.5rem}
.ak-alert{border-radius:12px;padding:0.7rem 0.85rem;font-size:0.9rem;margin-top:0.5rem}
.ak-alert-red{background:var(--ak-red-soft);color:var(--ak-red-ink);border:1px solid var(--ak-red-line)}
.ak-alert-green{background:var(--ak-brand-soft);color:var(--ak-brand-2);border:1px solid var(--ak-brand-line)}
.ak-alert-amber{background:var(--ak-amber-soft);color:var(--ak-amber-ink-2);border:1px solid var(--ak-amber-line)}
.ak-alert-neutral{background:var(--ak-muted-surface);color:var(--ak-ink-2);border:1px solid var(--ak-line)}
.ak-check{display:flex;gap:0.55rem;align-items:flex-start;font-size:0.92rem;cursor:pointer}
.ak-check input{width:20px;height:20px;margin-top:0.15rem;accent-color:var(--ak-brand);flex:0 0 auto}
.ak-explain{display:grid;gap:0.75rem;min-width:0}
.ak-explain .ak-card{margin:0}
.ak-why{margin:0;padding-left:0;list-style:none;display:grid;gap:0.7rem}
.ak-why li{border-left:3px solid var(--ak-line);padding-left:0.7rem}
.ak-why li.on{border-left-color:var(--ak-brand)}
.ak-why li div{font-size:0.92rem;color:var(--ak-ink-2)}
.ak-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.85rem}
.ak-grid-2 > *{min-width:0}
.ak-table-wrap{overflow-x:auto;border:1px solid var(--ak-line);border-radius:12px}
.ak-table{width:100%;border-collapse:collapse;font-size:0.9rem;background:var(--ak-surface)}
.ak-table th,.ak-table td{text-align:left;padding:0.6rem 0.75rem;border-bottom:1px solid var(--ak-line);vertical-align:top}
.ak-table th{background:var(--ak-muted-surface);font-size:0.8rem;color:var(--ak-ink-2)}
.ak-table tr:last-child td{border-bottom:0}
.ak-table tr.mine{background:var(--ak-mine)}
.ak-num{font-variant-numeric:tabular-nums}
.ak-total-box{background:var(--ak-brand-soft);border-color:var(--ak-brand-line)}
.ak-total-box .ak-muted{color:var(--ak-brand-2)}
.ak-total{font-size:2rem;font-weight:800;color:var(--ak-brand-2);line-height:1.15}
.ak-plain-list{margin:0;padding-left:1.1rem}
.ak-timeline{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:0}
.ak-timeline > li{position:relative;padding:0 0 1rem 1.6rem;border-left:2px solid var(--ak-line);margin-left:0.5rem}
.ak-timeline > li:last-child{border-left-color:transparent;padding-bottom:0}
.ak-timeline > li::before{content:"";position:absolute;left:-8px;top:0.3rem;width:14px;height:14px;border-radius:50%;background:var(--ak-surface);border:3px solid var(--ak-brand)}
.ak-timeline > li.new::before{background:var(--ak-amber);border-color:var(--ak-amber)}
.ak-timeline .ak-desc{color:var(--ak-ink-2);font-size:0.9rem}
.ak-when{font-size:0.8rem;font-weight:800;color:var(--ak-brand-2);letter-spacing:0.02em}
.ak-footer{margin-top:1.5rem;font-size:0.8rem;color:var(--ak-ink-3)}
.ak-footer ol{padding-left:1.2rem}
.ak-footer li{margin-bottom:0.3rem;overflow-wrap:anywhere}
.ak-footer .ak-nav{margin:1rem 0 0}
.ak-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Entrance on tab or step change: transform and opacity only, nothing left on at rest. */
.ak-enter{animation:ak-in 0.22s ease-out both}
@keyframes ak-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ak-enter{animation:none}}
@media (max-width:900px){.ak-split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .ak-wrap{padding:1rem 1rem 2.5rem}
  .ak-grid-2{grid-template-columns:minmax(0,1fr)}
  .ak-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ak-kpi-value{font-size:1.25rem}
  .ak-phone{border-radius:18px;padding:0.85rem}
  .ak-table.ak-stack thead{display:none}
  .ak-table.ak-stack,.ak-table.ak-stack tbody,.ak-table.ak-stack tr,.ak-table.ak-stack td{display:block;width:100%}
  .ak-table.ak-stack tr{border-bottom:1px solid var(--ak-line);padding:0.4rem 0}
  .ak-table.ak-stack td{border-bottom:0;padding:0.25rem 0.75rem}
  .ak-table.ak-stack td[data-label]::before{content:attr(data-label);display:block;font-size:0.72rem;font-weight:700;color:var(--ak-ink-3)}
}
</style>
</head>

  function normaliseName(s) {
    return s.toLowerCase()
      .replace(/&/g, " and ")
      .replace(/[^\p{L}\p{M}\p{N}\s]/gu, " ")
      .replace(/\bvidyapeeth\b/g, "vidyapith")
      .replace(/\bbharatiya\b/g, "bhartiya")
      .replace(/\s+/g, " ")
      .trim();
  }
  function distinctive(s) {
    return normaliseName(s).split(" ").filter(function (w) { return w.length > 1 && !GENERIC[w]; });
  }
  // A match needs the whole listed name inside the query, or a query whose
  // distinctive words (at least two, ignoring words like "university") all
  // appear in one listed name. Typing "university" alone never matches.
  function findFakeUniversity(query) {
    var q = normaliseName(query);
    var qWords = distinctive(query);
    if (q.length < 4) return null;
    for (var i = 0; i < UGC_FAKE.length; i++) {
      var u = UGC_FAKE[i];
      var names = [u.name, u.hi].filter(Boolean);
      for (var j = 0; j < names.length; j++) {
        var n = normaliseName(names[j]);
        if (q.indexOf(n) !== -1) return u;
        var nWords = distinctive(names[j]);
        if (qWords.length >= 2 && qWords.every(function (w) { return nWords.indexOf(w) !== -1; })) return u;
      }
    }
    return null;
  }

  /* ---------- Helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function find(arr, fn) { for (var i = 0; i < arr.length; i++) if (fn(arr[i])) return arr[i]; return undefined; }
  function inr(n) { return "₹" + Math.round(n).toLocaleString("en-IN"); }
  function marksBand(m, lang) {
    var lo = Math.max(30, Math.floor(m / 10) * 10);
    var hi = Math.min(100, lo + 10);
    return lang === "en" ? lo + " to " + hi + "%" : lo + " से " + hi + "%";
  }
  function money(n, lang) {
    var v;
    if (n >= 10000000) {
      v = (n / 10000000).toLocaleString("en-IN", { maximumFractionDigits: 2 });
      return lang === "en" ? "₹" + v + " crore" : "₹" + v + " करोड़";
    }
    v = (n / 100000).toLocaleString("en-IN", { maximumFractionDigits: 1 });
    return lang === "en" ? "₹" + v + " lakh" : "₹" + v + " लाख";
  }
  function isLang(v) { return v === "en" || v === "hi"; }
  function saveLang(l) { try { window.localStorage.setItem(STORAGE_KEY, l); } catch (e) { /* storage blocked */ } }
  function copyObj(o) { var r = {}; for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = o[k]; return r; }

  /* ---------- State ---------- */
  function initialLang() {
    try {
      var fromUrl = new URLSearchParams(window.location.search).get("lang");
      if (isLang(fromUrl)) { saveLang(fromUrl); return fromUrl; }
    } catch (e) { /* fall through */ }
    try {
      var saved = window.localStorage.getItem(STORAGE_KEY);
      if (isLang(saved)) return saved;
    } catch (e) { /* storage blocked */ }
    return "en";
  }

  var S = {

    S.step = 0; S.chosen = []; S.adult = ""; S.studentName = ""; S.phone = "";
    resetConsent(); S.savedOnly = false; S.withdrawn = false; S.checkText = ""; S.checkResult = "";
    S.statuses = copyObj(INITIAL_STATUSES);
  }

  function computePlan() {
    var courses = COURSES.filter(function (c) { return c.streams.indexOf(S.stream) !== -1 && c.interests.indexOf(S.interest) !== -1; });
    if (courses.length === 0) courses = COURSES.filter(function (c) { return c.streams.indexOf(S.stream) !== -1 && c.interests.indexOf("unsure") !== -1; });
    courses = courses.slice(0, 4);
    var courseIds = {};
    courses.forEach(function (c) { courseIds[c.id] = true; });
    var examIds = [];
    courses.forEach(function (c) { c.exams.forEach(function (e) { if (examIds.indexOf(e) === -1) examIds.push(e); }); });
    var scholarships = SCHOLARSHIPS.filter(function (s) { return s.fits(S.income, S.marks); });
    var budgetMax = (find(BUDGETS, function (b) { return b.id === S.budget; }) || { max: Infinity }).max;
    // One list, ordered by fit only. Paying status is a label, never a boost.
    var colleges = DEMO_COLLEGES.map(function (c) {
      return { c: c, match: c.courses.filter(function (id) { return courseIds[id]; }).length };
    }).filter(function (x) {
      return x.match > 0 && x.c.fee <= budgetMax && (S.reach === "state" || x.c.km <= 15);
    }).sort(function (a, b) {
      return (b.match - a.match) || (a.c.fee - b.c.fee) || (a.c.km - b.c.km);
    }).map(function (x) { return x.c; });
    // Drop ticks for colleges that are no longer in the plan.
    var visible = colleges.map(function (c) { return c.id; });
    S.chosen = S.chosen.filter(function (id) { return visible.indexOf(id) !== -1; });
    return { courses: courses, examIds: examIds, scholarships: scholarships, colleges: colleges, hasMbbs: !!courseIds.mbbs };
  }

  function computeRevenue(rev) {
    var plans = rev.passed * (rev.reachPct / 100) * (rev.completePct / 100);
    var families = plans * (rev.coveragePct / 100) * (rev.consentPct / 100);
    var enquiries = families * rev.perStudent * (rev.paidPct / 100);
    var enqRev = enquiries * rev.price;
    var bundleRev = rev.bundles * rev.bundlePrice;
    var counselRev = plans * (rev.counselPct / 100) * rev.counselPrice;
    return { plans: plans, families: families, enquiries: enquiries, enqRev: enqRev, bundleRev: bundleRev, counselRev: counselRev, total: enqRev + bundleRev + counselRev };
  }

    var list = [];
    if (sentToPartner) {
      var stream = find(STREAMS, function (s) { return s.id === S.stream; });
      var nm = S.studentName.trim();
      var course = courseFor(plan, partner);
      list.push({
        id: "you", when: { en: t.yours, hi: t.yours },
        who: nm ? nm.slice(0, 1).toUpperCase() + "***" : "D***",
        district: DISTRICTS[S.districtIdx],
        profile: { en: stream.label.en + ", " + marksBand(S.marks, "en"), hi: stream.label.hi + ", " + marksBand(S.marks, "hi") },
        course: course ? course.name : { en: "-", hi: "-" },
        mine: true
      });
    }
    return { list: list.concat(BASE_ENQUIRIES), sentToPartner: sentToPartner };
  }

  function renderCollege(t, plan) {
    var e = enquiryList(t, plan);
    var enquiries = e.list;
    var called = enquiries.filter(function (x) { return (S.statuses[x.id] || "new") !== "new"; }).length;
    var statusKeys = ["new", "called", "visit", "admitted", "no"];
    var h = '<section id="panel-college" role="tabpanel" aria-labelledby="tab-college"' + (S._animTab ? ' class="ak-enter"' : "") + '><div class="ak-card"><h2>' + esc(t.collegeTitle) + "</h2>" +
      '<p class="ak-muted" style="margin-top:0">' + esc(t.collegeLead) + "</p>" +
      '<div class="ak-kpis" style="margin:0.75rem 0" data-testid="ak-college-kpis">' +
      '<div class="ak-kpi"><div class="ak-kpi-value ak-num" data-testid="ak-enq-count">' + enquiries.length + '</div><div class="ak-kpi-label">' + esc(t.kpiEnq) + "</div></div>" +
      '<div class="ak-kpi"><div class="ak-kpi-value">100%</div><div class="ak-kpi-label">' + esc(t.kpiConsent) + "</div></div>" +
      '<div class="ak-kpi"><div class="ak-kpi-value ak-num">' + called + " / " + enquiries.length + '</div><div class="ak-kpi-label">' + esc(t.kpiCalled) + "</div></div>" +
      '<div class="ak-kpi"><div class="ak-kpi-value ak-num">' + inr(enquiries.length * S.rev.price) + '</div><div class="ak-kpi-label">' + esc(t.kpiBill(inr(S.rev.price))) + "</div></div></div>" +
      '<div class="ak-table-wrap"><table class="ak-table ak-stack" role="table"><thead role="rowgroup"><tr role="row">' +
      [t.thWhen, t.thWho, t.thDistrict, t.thProfile, t.thCourse, t.thConsent, t.thStatus].map(function (x) { return '<th role="columnheader">' + esc(x) + "</th>"; }).join("") +
      '</tr></thead><tbody role="rowgroup">' +
      enquiries.map(function (q) {
        var st = S.statuses[q.id] || "new";
        return '<tr role="row"' + (q.mine ? ' class="mine" data-testid="ak-my-enquiry"' : "") + ">" +
          '<td role="cell" data-label="' + esc(t.thWhen) + '">' + esc(pick(q.when)) + "</td>" +
          '<td role="cell" data-label="' + esc(t.thWho) + '">' + esc(q.who) + "</td>" +
          '<td role="cell" data-label="' + esc(t.thDistrict) + '">' + esc(pick(q.district)) + "</td>" +
          '<td role="cell" data-label="' + esc(t.thProfile) + '">' + esc(pick(q.profile)) + "</td>" +
          '<td role="cell" data-label="' + esc(t.thCourse) + '">' + esc(pick(q.course)) + "</td>" +
          '<td role="cell" data-label="' + esc(t.thConsent) + '"><span class="ak-tag ak-tag-brand">✓ ' + esc(t.consentBadge) + "</span></td>" +
          '<td role="cell" data-label="' + esc(t.thStatus) + '"><select class="ak-select" id="st-' + q.id + '" data-act="status" data-id="' + q.id + '" aria-label="' + esc(t.thStatus + ": " + q.who) + '">' +
          statusKeys.map(function (s) { return '<option value="' + s + '"' + (s === st ? " selected" : "") + ">" + esc(t.status[s]) + "</option>"; }).join("") +
          "</select></td></tr>";
      }).join("") + "</tbody></table></div>" +
      (e.sentToPartner ? "" : '<p class="ak-muted">' + esc(t.yoursHint) + "</p>") + "</div>" +
      '<div class="ak-grid-2" style="margin-top:0.85rem"><div class="ak-card"><h3>' + esc(t.rulesTitle) + '</h3><ul class="ak-plain-list">' +
      t.rules.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="ak-card" style="margin-top:0"><h3>' + esc(t.bundleTitle) + '</h3><ul class="ak-plain-list">' +
      t.bundle.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul><div class="ak-alert ak-alert-amber">' + esc(t.priceNote) + "</div></div></div></section>";
    return h;
  }

  var REV_FIELDS = [
    ["passed", "inPassed", 1000], ["reachPct", "inReach", 1], ["completePct", "inComplete", 1], ["coveragePct", "inCoverage", 5],
    ["consentPct", "inConsent", 1], ["perStudent", "inPer", 0.5], ["paidPct", "inPaid", 5], ["price", "inPrice", 10],
    ["bundles", "inBundles", 5], ["bundlePrice", "inBundlePrice", 5000], ["counselPct", "inCounsel", 0.5], ["counselPrice", "inCounselPrice", 10]
  ];

  function revOutputs(t) {
    var r = computeRevenue(S.rev);
    return '<div class="ak-item"><strong>' + esc(t.funnel) + "</strong>" +
      "<p>" + esc(t.fPlans) + ': <strong class="ak-num" data-testid="ak-plans">' + Math.round(r.plans).toLocaleString("en-IN") + "</strong></p>" +
      "<p>" + esc(t.fFamilies) + ': <strong class="ak-num" data-testid="ak-families">' + Math.round(r.families).toLocaleString("en-IN") + "</strong></p>" +
      "<p>" + esc(t.fEnquiries) + ': <strong class="ak-num" data-testid="ak-enquiries">' + Math.round(r.enquiries).toLocaleString("en-IN") + "</strong></p></div>" +
      '<div class="ak-item" style="margin-top:0.6rem">' +
      "<p>" + esc(t.rEnq) + ': <strong class="ak-num" data-testid="ak-enq-rev">' + money(r.enqRev, S.lang) + "</strong></p>" +
      "<p>" + esc(t.rBundle) + ': <strong class="ak-num" data-testid="ak-bundle-rev">' + money(r.bundleRev, S.lang) + "</strong></p>" +
      "<p>" + esc(t.rCounsel) + ': <strong class="ak-num" data-testid="ak-counsel-rev">' + money(r.counselRev, S.lang) + "</strong></p></div>" +
      '<div class="ak-item ak-total-box" style="margin-top:0.6rem"><div class="ak-muted">' + esc(t.rTotal) + '</div><div class="ak-total ak-num" data-testid="ak-total">' + money(r.total, S.lang) + "</div></div>" +
      '<p class="ak-muted">' + esc(t.notForecast) + "</p>";
  }

  function scenarioButtons(t) {
    return ["low", "base", "high"].map(function (s) {
      return '<button type="button" class="ak-tab" id="scen-' + s + '" data-act="preset" data-scen="' + s + '" aria-pressed="' + (S.scenario === s) + '">' + esc(t.scen[s]) + "</button>";
    }).join("") + (S.scenario === "custom" ? '<span class="ak-tag">' + esc(t.scen.custom) + "</span>" : "");
  }

  function renderRevenue(t) {
    return '<section id="panel-revenue" role="tabpanel" aria-labelledby="tab-revenue"' + (S._animTab ? ' class="ak-enter"' : "") + '><div class="ak-card"><h2>' + esc(t.revTitle) + "</h2>" +
      '<p class="ak-muted" style="margin-top:0">' + esc(t.revLead) + "</p>" +
      '<div class="ak-row" role="group" aria-label="' + esc(t.scenLabel) + '" style="margin-bottom:0.85rem" id="ak-scen">' + scenarioButtons(t) + "</div>" +
      '<div class="ak-grid-2"><div class="ak-grid-2" style="align-content:start">' +
      REV_FIELDS.map(function (f) {
        var k = f[0];
        return '<div class="ak-field" style="margin:0"><label for="rev-' + k + '" style="font-size:0.85rem">' + esc(t[f[1]]) + "</label>" +
          '<input id="rev-' + k + '" class="ak-input ak-num" type="number" min="0"' + (PERCENT_FIELDS.indexOf(k) !== -1 ? ' max="100"' : "") +
          ' step="' + f[2] + '" value="' + S.rev[k] + '" data-act="rev" data-k="' + k + '"></div>';
      }).join("") + '</div><div id="ak-rev-out">' + revOutputs(t) + "</div></div></div>" +
      '<div class="ak-grid-2" style="margin-top:0.85rem"><div class="ak-card" style="margin:0"><h3>' + esc(t.whySmall) + '</h3><p style="margin:0">' + esc(t.whySmallText) + "</p></div>" +
      '<div class="ak-card" style="margin:0"><h3>' + esc(t.mustBeTrue) + '</h3><ol class="ak-plain-list" style="padding-left:1.2rem">' +
      t.mustList.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></div></div></section>";
  }

  function renderPlatform(t) {
    return '<section id="panel-platform" role="tabpanel" aria-labelledby="tab-platform"' + (S._animTab ? ' class="ak-enter"' : "") + '><div class="ak-card"><h2>' + esc(t.platTitle) + "</h2>" +
      '<p class="ak-muted" style="margin-top:0">' + esc(t.platLead) + '</p><ol class="ak-timeline">' +
      t.journey.map(function (j) {
        return '<li class="' + (j.url ? "" : "new") + '"><div class="ak-when">' + esc(j.when) + '</div><div class="ak-row" style="gap:0.4rem"><strong>' + esc(j.h) + "</strong>" +
          '<span class="ak-tag ' + (j.url ? "" : "ak-tag-amber") + '">' + esc(j.url ? t.runsToday : t.isNew) + "</span></div>" +
          '<div class="ak-desc">' + esc(j.p) + " " + (j.url ? '<a href="' + j.url + '"' + EXT + ' aria-label="' + esc(t.sourceFor(j.h)) + '">↗</a>' : "") + "</div></li>";
      }).join("") + "</ol></div>" +
      '<div class="ak-card"><h3>' + esc(t.gainsTitle) + '</h3><div class="ak-table-wrap"><table class="ak-table ak-stack" role="table"><thead role="rowgroup"><tr role="row">' +
      '<th role="columnheader">' + esc(t.gainsWho) + '</th><th role="columnheader">' + esc(t.gainsWhat) + '</th></tr></thead><tbody role="rowgroup">' +
      t.gains.map(function (g) {
        return '<tr role="row"><td role="cell" data-label="' + esc(t.gainsWho) + '"><strong>' + esc(g.who) + '</strong></td><td role="cell" data-label="' + esc(t.gainsWhat) + '">' + esc(g.what) + "</td></tr>";
      }).join("") + "</tbody></table></div></div></section>";
  }

  function siteNav(t) {
    return '<nav class="ak-nav" aria-label="' + esc(t.navLabel) + '"><a href="/amar-ujala/study" target="_top">' + esc(t.backStudy) + '</a><a href="/" target="_top">' + esc(t.portfolio) + "</a></nav>";
  }

  function render() {
    var t = COPY[S.lang];
    var plan = computePlan();
    // Capture focus so a re-render does not drop the reader's place.
    var active = document.activeElement;
    var focusId = active && active.id && root.contains(active) ? active.id : "";
    var selStart = null, selEnd = null;
    try { if (focusId && typeof active.selectionStart === "number") { selStart = active.selectionStart; selEnd = active.selectionEnd; } } catch (e) { /* not a text field */ }

    S._animTab = !firstRender && S.tab !== lastTab;
    S._animStep = !firstRender && (S.step !== lastStep || S._animTab);

    document.documentElement.lang = S.lang;
    notice.innerHTML = t.notice;

    var h = '<div class="ak-wrap">' + siteNav(t) +
      '<div class="ak-topbar"><div class="ak-tags"><span class="ak-tag ak-tag-brand">' + esc(t.badge) + '</span><span class="ak-tag ak-tag-amber">' + esc(t.independent) + "</span></div>" +
      '<div role="group" aria-label="Language / भाषा" class="ak-lang"><button type="button" lang="en" id="lang-en" data-act="lang" data-lang="en" aria-pressed="' + (S.lang === "en") + '">English</button>' +
      '<button type="button" lang="hi" id="lang-hi" data-act="lang" data-lang="hi" aria-pressed="' + (S.lang === "hi") + '">हिंदी</button></div></div>' +
      '<header class="ak-hero"><h1>' + esc(t.title) + '</h1><p class="ak-lead">' + esc(t.lead) + "</p>" +
      '<div class="ak-row"><a class="ak-btn" href="/amar-ujala/study" target="_top">' + esc(t.planLink) + ' →</a><span class="ak-tag">' + esc(t.demoData) + "</span></div></header>" +
      '<section class="ak-kpis" aria-label="' + esc(t.kpiLabel) + '">' +
      t.kpis.map(function (k) { return '<div class="ak-kpi"><div class="ak-kpi-value">' + esc(k.v) + '</div><div class="ak-kpi-label">' + esc(k.l) + '</div><div class="ak-kpi-src">' + esc(k.s) + "</div></div>"; }).join("") +
      "</section>" +
      '<div class="ak-tabs" role="tablist" aria-label="' + esc(t.tabsLabel) + '">' +
      TABS.map(function (id) {
        var sel = S.tab === id;
        return '<button type="button" role="tab" id="tab-' + id + '" aria-selected="' + sel + '"' + (sel ? ' aria-controls="panel-' + id + '"' : "") +
          ' tabindex="' + (sel ? 0 : -1) + '" class="ak-tab" data-act="tab" data-tab="' + id + '">' + esc(t.tabs[id]) + "</button>";
      }).join("") + "</div>";

    if (S.tab === "student") h += renderStudent(t, plan);
    else if (S.tab === "college") h += renderCollege(t, plan);
    else if (S.tab === "revenue") h += renderRevenue(t);
    else h += renderPlatform(t);

    h += '<footer class="ak-footer"><p>' + esc(t.footer) + "</p><strong>" + esc(t.sourcesTitle) + "</strong><ol>" +
      SOURCE_LIST.map(function (s) { return '<li><a href="' + s.url + '"' + EXT + ">" + esc(s.label) + "</a></li>"; }).join("") +
      "</ol>" + siteNav(t) + "</footer></div>";

    root.innerHTML = h;

    var stepChanged = S.step !== lastStep;
    if (!firstRender && stepChanged && S.tab === "student") {
      // Move focus to the new step's heading so keyboard and screen-reader
      // users land on the new content.
      var head = document.getElementById("ak-step-h");
      if (head) head.focus({ preventScroll: false });
    } else if (focusId) {
      var el = document.getElementById(focusId);
      if (el) {
        el.focus({ preventScroll: true });
        if (selStart !== null) { try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* ignore */ } }
      }
    }
    lastStep = S.step;
    lastTab = S.tab;
    firstRender = false;
  }

  /* ---------- Actions ---------- */
  function setLang(next) {
    S.lang = next;
    saveLang(next);
    try {
      var url = new URL(window.location.href);
      if (url.searchParams.has("lang")) {
        url.searchParams.set("lang", next);
        window.history.replaceState(window.history.state, "", url);
      }
    } catch (e) { /* history unavailable */ }
    render();
  }

  function runCheck() {
    var hit = findFakeUniversity(S.checkText);
    if (hit) {
      S.checkMatch = (S.lang === "hi" && hit.hi ? hit.hi : hit.name) + ", " + hit.place + " (" + hit.state + ")";
      S.checkResult = "fake";
    } else {
      var words = S.checkText.trim().split(/\s+/).filter(function (w) { return w.length > 1; });
      S.checkResult = words.length < 2 ? "short" : "ok";
    }
    var live = document.getElementById("ak-check-live");
    if (live) live.innerHTML = checkResultHtml(COPY[S.lang]);
  }

  function updateRevenueOutputs() {
    var t = COPY[S.lang];
    var out = document.getElementById("ak-rev-out");
    if (out) out.innerHTML = revOutputs(t);
    var sc = document.getElementById("ak-scen");
    if (sc) {
      // Keep the scenario buttons in place (focus stays put); only sync state.
      ["low", "base", "high"].forEach(function (s) {
        var b = document.getElementById("scen-" + s);
        if (b) b.setAttribute("aria-pressed", String(S.scenario === s));
      });
      var tag = sc.querySelector(".ak-tag");
      if (S.scenario === "custom" && !tag) { tag = document.createElement("span"); tag.className = "ak-tag"; tag.textContent = t.scen.custom; sc.appendChild(tag); }
      if (S.scenario !== "custom" && tag) tag.remove();
    }
  }

  root.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el || !root.contains(el)) return;
    var act = el.getAttribute("data-act");
    switch (act) {
      case "lang": setLang(el.getAttribute("data-lang")); break;
      case "tab": S.tab = el.getAttribute("data-tab"); render(); break;
      case "goStep": S.step = Number(el.getAttribute("data-step")); render(); break;
      case "toConsent": S.savedOnly = false; resetConsent(); S.step = 3; render(); break;
      case "saveOnly": S.savedOnly = true; S.step = 4; render(); break;
      case "consentBack": resetConsent(); S.step = 2; render(); break;
      case "sendOtp": S.otpSent = true; render(); break;
      case "verify": S.otpState = S.otp === DEMO_OTP ? "ok" : "wrong"; render(); break;
      case "seeDashboard": S.tab = "college"; render(); break;
      case "withdraw": S.withdrawn = true; render(); break;
      case "startOver": reset(); render(); break;
      case "preset": {
        var s = el.getAttribute("data-scen");
        S.scenario = s; S.rev = copyObj(PRESETS[s]);
        render();
        break;
      }
    }
  });

  root.addEventListener("change", function (e) {
    var el = e.target;
    if (el.hasAttribute("data-chip")) {
      var name = el.getAttribute("data-chip");
      if (name === "adult") { S.adult = el.value; resetConsent(); render(); }
      else S[name] = el.value;
      return;
    }
    var act = el.getAttribute("data-act");
    if (act === "district") S.districtIdx = Number(el.value);
    else if (act === "college") {
      var id = el.getAttribute("data-id");
      var i = S.chosen.indexOf(id);
      if (i === -1) S.chosen.push(id); else S.chosen.splice(i, 1);
      // Any change to who receives the details voids an earlier consent.
      S.agree = false;
      render();
    } else if (act === "agree") { S.agree = el.checked; render(); }
    else if (act === "status") { S.statuses[el.getAttribute("data-id")] = el.value; render(); }
  });

  root.addEventListener("input", function (e) {
    var el = e.target;
    var act = el.getAttribute("data-act");
    if (act === "marks") {
      S.marks = Number(el.value);
      var v = document.getElementById("ak-marks-val");
      if (v) v.textContent = S.marks + "%";
    } else if (act === "checkText") {
      S.checkText = el.value; S.checkResult = "";
      var live = document.getElementById("ak-check-live");
      if (live) live.innerHTML = "";
    } else if (act === "name") {
      S.studentName = el.value;
    } else if (act === "phone") {
      S.phone = el.value.replace(/\D/g, "");
      resetConsent();
      render();
    } else if (act === "otp") {
      S.otp = el.value.replace(/\D/g, "");
      S.otpState = ""; S.agree = false;
      render();
    } else if (act === "rev") {
      var k = el.getAttribute("data-k");
      var n = Number(el.value);
      if (!isFinite(n) || n < 0) n = 0;
      if (PERCENT_FIELDS.indexOf(k) !== -1) n = Math.min(100, n);
      S.scenario = "custom";
      S.rev[k] = n;
      // Mirror a controlled input: write back only when the number differs.
      if (el.value === "" || Number(el.value) !== n) el.value = String(n);
      updateRevenueOutputs();
    }
  });

  root.addEventListener("keydown", function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute("role") === "tab") {
      var i = TABS.indexOf(S.tab), next = -1;
      if (e.key === "ArrowRight") next = (i + 1) % TABS.length;
      if (e.key === "ArrowLeft") next = (i - 1 + TABS.length) % TABS.length;
      if (e.key === "Home") next = 0;
      if (e.key === "End") next = TABS.length - 1;
      if (next < 0) return;
      e.preventDefault();
      S.tab = TABS[next];
      render();
      var tb = document.getElementById("tab-" + TABS[next]);
      if (tb) tb.focus();
      return;
    }
    if (el.id === "ak-otp" && e.key === "Enter") {
      e.preventDefault();
      S.otpState = S.otp === DEMO_OTP ? "ok" : "wrong";
      render();
    }
  });

  root.addEventListener("submit", function (e) {
    var form = e.target.getAttribute("data-form");
    if (!form) return;
    e.preventDefault();
    if (form === "questions") { S.step = 2; render(); }
    else if (form === "check") runCheck();
    else if (form === "consent") { if (S.otpState === "ok" && S.agree) { S.step = 4; render(); } }
  });

  // Keep other open tabs in step with a language change made elsewhere.
  window.addEventListener("storage", function (e) {
    if (e.key === STORAGE_KEY && isLang(e.newValue) && e.newValue !== S.lang) { S.lang = e.newValue; render(); }
  });

  render();
})();
</script>
</body>
</html>
