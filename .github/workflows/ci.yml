name: CI
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package.json
            side-husle/how-to-1/package.json

      - name: Install portfolio dependencies
        run: npm install --no-audit --no-fund

      - name: HTML smoke test
        run: |
          test -f index.html
          test -f task-tracker.html
          node -e "const fs=require('fs');for(const f of ['index.html','task-tracker.html']){const s=fs.readFileSync(f,'utf8');if(!/<!doctype html>/i.test(s))process.exit(1);console.log(f+' OK ('+s.length+' bytes)')}"

      - name: Validate shared app and project systems
        run: |
          node --check assets/app-skill-map.js
          node --check assets/project-playbooks.js
          node --check assets/task-tracker-shell.js
          test -s assets/app-skill-map.css
          test -s assets/project-playbooks.css
          test -s docs/APP_SKILL_MAP.md
          test -s docs/PROJECT_SKILLTREE_GUIDES.md
          grep -q "AnchitProjectPlaybooks" assets/project-playbooks.js
          grep -q "GUIDE_KINDS" assets/project-playbooks.js
          grep -q "taskTracker.path = '/task-tracker'" assets/task-tracker-shell.js
          grep -q "personal-ai-assistant-anchit.vercel.app" task-tracker.html
          if grep -R "mcp_token=" assets/app-skill-map.js assets/app-skill-map.css assets/project-playbooks.js assets/project-playbooks.css assets/task-tracker-shell.js docs/APP_SKILL_MAP.md docs/PROJECT_SKILLTREE_GUIDES.md scripts/build-www.mjs task-tracker.html; then
            echo "Reference access token must never be committed"
            exit 1
          fi

      - name: Build portfolio and How-To Engine
        run: npm run build

      - name: Verify canonical app routes
        run: |
          test -f www/how-to-2/index.html
          grep -q '/how-to-2/' www/how-to-2/index.html
          grep -q 'href="/how-to-2"' www/index.html
          test ! -d www/how-to
          test ! -d www/how-to-1
          test -f www/task-tracker.html
          test -f www/assets/task-tracker-shell.js
          grep -q 'data-app-skill-map="runtime"' www/task-tracker.html
          grep -q 'data-project-playbooks="runtime"' www/task-tracker.html
          grep -q 'personal-ai-assistant-anchit.vercel.app' www/task-tracker.html
          grep -Fq "path: '/task-tracker'" www/assets/app-skill-map.js
          grep -Fq "aliases: ['/task-tracker.html']" www/assets/app-skill-map.js
          grep -Fq "path: '/task-tracker'" www/assets/project-playbooks.js
          if grep -Fq "path: 'https://personal-ai-assistant-anchit.vercel.app/'" www/assets/app-skill-map.js; then
            echo 'Generated App Skill Map still routes Task Tracker outside the shared shell'
            exit 1
          fi
          node -e "const v=require('./vercel.json');const r=v.rewrites.find(x=>x.source==='/task-tracker');if(!r||r.destination!=='/task-tracker.html')process.exit(1);console.log('Task Tracker route OK: /task-tracker')"
          echo 'How-To Engine route OK: /how-to-2'

      - name: Verify shared systems across all built apps
        run: |
          test -s www/assets/app-skill-map.js
          test -s www/assets/app-skill-map.css
          test -s www/assets/project-playbooks.js
          test -s www/assets/project-playbooks.css
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const file = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(file) : entry.isFile() && entry.name.endsWith('.html') ? [file] : [];
            });
          }

          const htmlFiles = walk('www');
          if (htmlFiles.length < 21) {
            console.error(`Expected at least 21 built HTML apps, found ${htmlFiles.length}`);
            process.exit(1);
          }

          const missing = htmlFiles.filter((file) => {
            const html = fs.readFileSync(file, 'utf8');
            return !html.includes('data-app-skill-map="styles"') ||
              !html.includes('data-app-skill-map="runtime"') ||
              !html.includes('data-project-playbooks="styles"') ||
              !html.includes('data-project-playbooks="runtime"');
          });

          if (missing.length) {
            console.error('Shared UI injection missing from:\n' + missing.join('\n'));
            process.exit(1);
          }

          const projectSource = fs.readFileSync('www/assets/project-playbooks.js', 'utf8');
          const required = ['Quickstart Guide', 'Operator Mega-Prompt', 'Evidence Audit Prompt', '9.5/10 Improvement Loop', 'ROLE', 'CONTEXT', 'TASK', 'CONSTRAINTS', 'OUTPUT FORMAT'];
          const absent = required.filter((needle) => !projectSource.includes(needle));
          if (absent.length) {
            console.error('Project playbook source is missing required contracts: ' + absent.join(', '));
            process.exit(1);
          }

          console.log(`App Skill Map and Project Playbooks present in ${htmlFiles.length} built HTML apps`);
          NODE
