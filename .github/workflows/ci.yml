name: CI
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package.json
            side-husle/how-to-1/package.json

      - name: Install portfolio dependencies
        run: npm install --no-audit --no-fund

      - name: HTML smoke test
        run: |
          test -f index.html
          test -f task-tracker.html
          node -e "const fs=require('fs');for(const f of ['index.html','task-tracker.html']){const s=fs.readFileSync(f,'utf8');if(!/<!doctype html>/i.test(s))process.exit(1);console.log(f+' OK ('+s.length+' bytes)')}"

      - name: Validate shared app and project systems
        run: |
          node --check assets/app-skill-map.js
          node --check assets/project-playbooks.js
          node --check assets/task-tracker-shell.js
          test -s assets/app-skill-map.css
          test -s assets/project-playbooks.css
          test -s docs/APP_SKILL_MAP.md
          test -s docs/PROJECT_SKILLTREE_GUIDES.md
          grep -q "AnchitProjectPlaybooks" assets/project-playbooks.js
          grep -q "GUIDE_KINDS" assets/project-playbooks.js
          grep -q "taskTracker.path = '/task-tracker'" assets/task-tracker-shell.js
          grep -q "personal-ai-assistant-anchit.vercel.app" task-tracker.html
          if grep -R "mcp_token=" assets/app-skill-map.js assets/app-skill-map.css assets/project-playbooks.js assets/project-playbooks.css assets/task-tracker-shell.js docs/APP_SKILL_MAP.md docs/PROJECT_SKILLTREE_GUIDES.md scripts/build-www.mjs task-tracker.html; then
            echo "Reference access token must never be committed"
            exit 1
          fi

      - name: Build portfolio and How-To Engine
        run: npm run build

      - name: Verify canonical app routes
        run: |
          test -f www/how-to/index.html
          grep -q '/how-to/' www/how-to/index.html
          grep -q 'href="/how-to"' www/index.html
          test ! -d www/how-to-1
          test ! -d www/how-to-2
          test -f www/task-tracker.html
          node -e "const v=require('./vercel.json');const r=v.rewrites.find(x=>x.source==='/how-to');if(!r||r.destination!=='/how-to/index.html')process.exit(1);console.log('How-To Engine route OK: /how-to')"
          echo 'How-To Engine route OK: /how-to'
