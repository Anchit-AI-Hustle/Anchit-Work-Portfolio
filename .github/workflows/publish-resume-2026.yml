name: Publish final resume PDF
on:
  push:
    paths:
      - .github/workflows/publish-resume-2026.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: python -m pip install reportlab
      - name: Restore resume source and render
        env:
          SOURCE: ''
        run: |
          python - <<'PYCODE'
          import os, zlib, base64, pathlib
          pathlib.Path('scripts').mkdir(exist_ok=True)
          pathlib.Path('scripts/build_resume_site_pdf.py').write_bytes(zlib.decompress(base64.b64decode(os.environ['SOURCE'])))
          PYCODE
          python scripts/build_resume_site_pdf.py
          test -s assets/resume.pdf
      - name: Publish updated resume to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_resume_site_pdf.py assets/resume.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish final 23-project resume for 2026'
          git push
