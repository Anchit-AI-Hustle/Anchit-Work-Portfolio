    .task-fallback-card h1{margin:0 0 10px;font-family:Georgia,serif;font-size:clamp(30px,6vw,54px);font-weight:500;letter-spacing:-.035em}
    .task-fallback-card p{margin:0 0 20px;color:var(--shell-dim);line-height:1.6}
    .task-fallback-card a{display:inline-flex;min-height:42px;align-items:center;padding:0 16px;border:1px solid rgba(255,183,54,.45);border-radius:999px;background:rgba(255,183,54,.1);color:var(--shell-ink);font-weight:700;text-decoration:none}
